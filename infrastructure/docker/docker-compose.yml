services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: black_whale
      POSTGRES_USER: bw_user
      POSTGRES_PASSWORD: bw_password
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bw_user -d black_whale']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.migrate
    # Fresh development stacks have no Prisma migration history yet. db push
    # creates the single canonical Prisma schema; production upgrades use the
    # reviewed additive migration in packages/database/prisma/migrations.
    command:
      [
        'pnpm',
        '--filter',
        '@black-whale/database',
        'exec',
        'prisma',
        'db',
        'push',
        '--skip-generate',
      ]
    environment:
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-bw_user}:${POSTGRES_PASSWORD:-bw_password}@postgres:5432/${POSTGRES_DB:-black_whale}'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-bw_user}:${POSTGRES_PASSWORD:-bw_password}@postgres:5432/${POSTGRES_DB:-black_whale}'
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_TOKEN: ${OLLAMA_TOKEN:-}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-8000}
      CLASH_OLLAMA_URL: ${CLASH_OLLAMA_URL:-}
      CLASH_OLLAMA_MODEL: ${CLASH_OLLAMA_MODEL:-}
      CLASH_OLLAMA_TOKEN: ${CLASH_OLLAMA_TOKEN:-}
      CLASH_OLLAMA_MODEL_P1: ${CLASH_OLLAMA_MODEL_P1:-}
      CLASH_OLLAMA_MODEL_P2: ${CLASH_OLLAMA_MODEL_P2:-}
      CLASH_OLLAMA_URL_P1: ${CLASH_OLLAMA_URL_P1:-}
      CLASH_OLLAMA_URL_P2: ${CLASH_OLLAMA_URL_P2:-}
      CLASH_OLLAMA_TOKEN_P1: ${CLASH_OLLAMA_TOKEN_P1:-}
      CLASH_OLLAMA_TOKEN_P2: ${CLASH_OLLAMA_TOKEN_P2:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  admin:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.admin
    ports:
      - '3002:3002'
    environment:
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-bw_user}:${POSTGRES_PASSWORD:-bw_password}@postgres:5432/${POSTGRES_DB:-black_whale}'
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
