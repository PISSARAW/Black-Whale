name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  POSTGRES_USER: bw_user
  POSTGRES_PASSWORD: bw_password
  POSTGRES_DB: black_whale_test

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. The action reads the `packageManager`
      # field in package.json, and pinning a second version makes it refuse to
      # run at all rather than pick one.
      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Prisma client is generated code, and nothing in the install
      # generates it. Without it every `prisma.*` call is typed `any`, so the
      # type check fails on implicit-any callbacks that are fully typed in a
      # working checkout. Dockerfile.web generates it for the same reason.
      - name: Generate Prisma client
        run: pnpm --filter "@black-whale/database" generate

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      # ADR-001 makes `data/` the single declaration of every canonical fact.
      # That only holds if something refuses a declaration that contradicts
      # another one. The 27 names and 48 owners that had already diverged in
      # production are what this exists to make impossible.
      - name: Canon lint
        run: pnpm canon-lint

      - name: Build packages
        run: pnpm build --filter "./packages/*"

      # The web hatsu registry is compiled from `data/` and the modules' `site`
      # blocks, the arena's contract table from their `arena` blocks, and both
      # are committed so their changes get read. This answers non-zero when a
      # committed file is no longer what the compiler writes — a table edited
      # by hand, or a module changed without regenerating.
      - name: Hatsu registry is freshly compiled
        run: pnpm --filter "@black-whale/canon-compiler" check:hatsu

      - name: Build apps
        run: pnpm build --filter "./apps/*"

      # Development runs `prisma db push`, production runs `migrate deploy`.
      # Nothing compared the two, so a schema edited without a migration was
      # correct locally and absent in production until something 500ed. This
      # answers non-zero when the migration folder no longer replays into the
      # schema.
      - name: Migrations replay into the schema
        run: pnpm --filter "@black-whale/database" migrate:check
        env:
          SHADOW_DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}_shadow

      # Scoped to what ships. The dev toolchain has its own advisories — vite,
      # vitest, esbuild — and blocking every pull request on a major upgrade of
      # the test runner would only teach everyone to skip the step. Dependabot
      # (.github/dependabot.yml) raises those as pull requests instead.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Run tests with coverage
        run: pnpm test:coverage
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}

      - name: Publish coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: apps/*/coverage
          if-no-files-found: warn

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    # The only check that exercises the site as a visitor meets it: server
    # render, hydration, the spoiler cookie, a Hatsu cast, the admin gate.
    # Nothing ran it before, so the single spec in the repo had drifted away
    # from the interface without anybody hearing about it.

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Spelled out rather than composed from the workflow `env` above: a
      # job-level `env` block cannot read the `env` context.
      DATABASE_URL: postgresql://bw_user:bw_password@localhost:5432/black_whale_test
      ADMIN_PASSWORD: e2e-password-not-a-secret
      SESSION_SECRET: e2e-session-secret-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter "@black-whale/database" generate

      # The pages the smoke suite opens read the database, so the schema and
      # the catalogue both have to be there — the same two steps the deploy
      # runs, in the same order.
      - name: Apply migrations and compile the catalogue
        run: |
          pnpm --filter "@black-whale/database" migrate:deploy
          pnpm --filter "@black-whale/canon-compiler" compile:timeline:dev
          pnpm --filter "@black-whale/canon-compiler" compile:map:dev
          pnpm --filter "@black-whale/canon-compiler" compile:identities:dev
          pnpm --filter "@black-whale/canon-compiler" compile:chapters:dev

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e --project=chromium

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  images:
    name: Container images
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Separate from the test job on purpose: the runtime images are the only
    # thing production actually runs, and until now nothing ever built them
    # outside the deploy script — on the server, under time pressure. A
    # Dockerfile that no longer builds was a discovery made during a release.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.web
          push: false
          load: true
          tags: black-whale/web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.admin
          push: false
          load: true
          tags: black-whale/admin:ci
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max

      - name: Build migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.migrate
          push: false
          load: true
          tags: black-whale/migrate:ci
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max

      # The images were slimmed by listing what the runtime opens rather than
      # copying the checkout. That is only true for as long as nobody adds a
      # `COPY . .` back, so it is asserted rather than trusted.
      - name: The runtime images carry no sources
        run: |
          set -eu
          for image in black-whale/web:ci black-whale/admin:ci; do
            if docker run --rm --entrypoint sh "$image" -c 'ls apps/*/src' >/dev/null 2>&1; then
              echo "$image still ships application sources" >&2
              exit 1
            fi
            echo "$image: no sources"
            docker image inspect "$image" --format '{{.RepoTags}} {{.Size}} bytes'
          done

      - name: The web image can answer for itself
        run: |
          set -eu
          # `--network host` so the container reaches the job's Postgres service
          # on 127.0.0.1, the same address the rest of the workflow uses.
          docker run -d --name web-smoke --network host \
            -e NODE_ENV=production -e ORIGIN=http://localhost:3000 \
            -e DATABASE_URL=postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@127.0.0.1:5432/${{ env.POSTGRES_DB }} \
            black-whale/web:ci
          # /health answers 200 only once the process has booted *and* reached
          # Postgres — `SELECT 1` needs no schema, so an empty database is
          # enough to prove the image starts and can query.
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then
              echo "healthy after ${attempt}s"
              docker rm -f web-smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "the web image never became healthy" >&2
          docker logs web-smoke >&2
          exit 1
