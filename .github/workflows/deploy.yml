name: CD

concurrency:
  group: production-deploy
  cancel-in-progress: false

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types:
      - completed

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/black-whale
            git fetch origin main
            candidate='${{ github.event.workflow_run.head_sha }}'
            running_image=$(docker inspect black-whale-web-1 --format '{{.Config.Image}}' 2>/dev/null || true)
            running_health=$(docker inspect black-whale-web-1 --format '{{.State.Health.Status}}' 2>/dev/null || true)
            running_commit=${running_image##*:}
            # CI runs can finish out of order. A healthy newer release must
            # not be replaced by an older run that has only just completed.
            if [ "$running_health" = healthy ] &&
              git rev-parse --verify "${running_commit}^{commit}" >/dev/null 2>&1 &&
              git merge-base --is-ancestor "$candidate" "$running_commit"; then
              echo 'This commit or a newer release is already healthy; skipping stale deployment.'
              exit 0
            fi
            git reset --hard "$candidate
            ./infrastructure/hetzner/deploy.sh
