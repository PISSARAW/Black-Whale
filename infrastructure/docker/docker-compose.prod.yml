name: black-whale

# Every application image is tagged with the git commit it was built from, set
# by deploy.sh. Untagged images are indistinguishable once built, which is why
# there was no way back from a bad release other than checking out the previous
# commit and rebuilding — see rollback.sh.

x-app: &app
  restart: unless-stopped
  init: true
  networks: [backend]
  security_opt: [no-new-privileges:true]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-black_whale}
      POSTGRES_USER: ${POSTGRES_USER:-bw_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]

  migrate:
    <<: *app
    image: black-whale/migrate:${IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.migrate
    restart: 'no'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-bw_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-black_whale}
    depends_on:
      postgres: { condition: service_healthy }

  web:
    <<: *app
    image: black-whale/web:${IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOST: 0.0.0.0
      ORIGIN: https://${DOMAIN:?Set DOMAIN in .env.production}
      # Caddy is the single hop in front of this container, so the last entry of
      # X-Forwarded-For is the real client. Without these two, every request
      # appears to come from the Docker bridge address.
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: '1'
      BODY_SIZE_LIMIT: '512K'
      DATABASE_URL: postgresql://${POSTGRES_USER:-bw_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-black_whale}
      # Optional language model for the walk's finder. Empty means there is
      # none and the finder searches by name only, exactly as before.
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_TOKEN: ${OLLAMA_TOKEN:-}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-8000}
      CLASH_OLLAMA_URL: ${CLASH_OLLAMA_URL:-}
      CLASH_OLLAMA_MODEL: ${CLASH_OLLAMA_MODEL:-}
      CLASH_OLLAMA_TOKEN: ${CLASH_OLLAMA_TOKEN:-}
      CLASH_OLLAMA_MODEL_P1: ${CLASH_OLLAMA_MODEL_P1:-}
      CLASH_OLLAMA_MODEL_P2: ${CLASH_OLLAMA_MODEL_P2:-}
      CLASH_OLLAMA_URL_P1: ${CLASH_OLLAMA_URL_P1:-}
      CLASH_OLLAMA_URL_P2: ${CLASH_OLLAMA_URL_P2:-}
      CLASH_OLLAMA_TOKEN_P1: ${CLASH_OLLAMA_TOKEN_P1:-}
      CLASH_OLLAMA_TOKEN_P2: ${CLASH_OLLAMA_TOKEN_P2:-}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    # Ollama runs on the host, not in this stack: this name is how the
    # container reaches it. See infrastructure/hetzner/README.md.
    extra_hosts: ['host.docker.internal:host-gateway']
    expose: ['3000']
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/health]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      migrate: { condition: service_completed_successfully }

  admin:
    <<: *app
    image: black-whale/admin:${IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.admin
    environment:
      NODE_ENV: production
      PORT: '3002'
      HOST: 0.0.0.0
      ORIGIN: https://admin.${DOMAIN:?Set DOMAIN in .env.production}
      # The login rate limiter keys on the client address; without these it
      # would see only the Caddy container and bucket every attacker together.
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: '1'
      BODY_SIZE_LIMIT: '512K'
      DATABASE_URL: postgresql://${POSTGRES_USER:-bw_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-black_whale}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env.production}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env.production}
      UMAMI_URL: http://umami:3000
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      UMAMI_USERNAME: ${UMAMI_USERNAME:-black-whale}
      UMAMI_PASSWORD: ${UMAMI_PASSWORD:-}
    expose: ['3002']
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3002/health]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      migrate: { condition: service_completed_successfully }

  backup:
    restart: unless-stopped
    image: black-whale/backup:${IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.backup
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-black_whale}
      POSTGRES_USER: ${POSTGRES_USER:-bw_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # Off-site copy of the state dump. Unset by default: the backup keeps
      # working exactly as before, and turning it on is filling these in.
      # A target without a recipient key is refused rather than sent in clear.
      BACKUP_REMOTE_TARGET: ${BACKUP_REMOTE_TARGET:-}
      BACKUP_REMOTE_PORT: ${BACKUP_REMOTE_PORT:-23}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    volumes:
      - postgres_backups:/backups
      # Read-only, and only ever the public half of the pair plus the host key
      # of the box. Nothing mounted here can decrypt a dump.
      - ${BACKUP_SSH_KEY_FILE:-/dev/null}:/run/secrets/backup_ssh_key:ro
      - ${BACKUP_KNOWN_HOSTS_FILE:-/dev/null}:/run/secrets/backup_known_hosts:ro
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
    security_opt: [no-new-privileges:true]

  umami-db:
    image: postgres:16-alpine
    profiles: [analytics]
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-}
    volumes: [umami_data:/var/lib/postgresql/data]
    networks: [analytics]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U umami -d umami']
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]

  umami:
    image: ghcr.io/umami-software/umami:3.5.0
    profiles: [analytics]
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-}
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_TWO_FACTOR_KEY:-}
      DISABLE_TELEMETRY: '1'
      CLIENT_IP_HEADER: x-real-ip
    expose: ['3000']
    networks: [backend, analytics]
    depends_on:
      umami-db: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/heartbeat').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s
    security_opt: [no-new-privileges:true]

  umami-backup:
    image: postgres:16-alpine
    profiles: [analytics]
    restart: unless-stopped
    environment:
      PGHOST: umami-db
      PGUSER: umami
      PGDATABASE: umami
      PGPASSWORD: ${UMAMI_DB_PASSWORD:-}
    entrypoint: [/bin/sh, /backup-umami.sh]
    volumes:
      - ./backup-umami.sh:/backup-umami.sh:ro
      - umami_backups:/backups
    networks: [analytics]
    depends_on:
      umami-db: { condition: service_healthy }
    security_opt: [no-new-privileges:true]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend]
    depends_on:
      web: { condition: service_healthy }
      admin: { condition: service_healthy }
    security_opt: [no-new-privileges:true]

networks:
  backend:
    driver: bridge
  analytics:
    driver: bridge

volumes:
  postgres_data:
  postgres_backups:
  caddy_data:
  caddy_config:
  umami_data:
  umami_backups:
